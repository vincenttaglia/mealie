services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mealie_dev_mailpit
    restart: no
    environment:
      - "MP_SMTP_AUTH_ACCEPT_ANY=true"
      - "MP_SMTP_AUTH_ALLOW_INSECURE=true"
    ports:
      - "8025:8025"
      - "1025:1025"
  postgres:
    container_name: mealie_dev_postgres
    image: postgres:15
    restart: no
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: mealie
      POSTGRES_USER: mealie
    volumes:
      - ../dev/data/postgres:/var/lib/postgresql/data
  minio:
    container_name: mealie_dev_minio
    image: minio/minio
    restart: no
    command: server /data --console-address :9090
    ports:
      # the backend API already uses 9000, so remap the MinIO S3 API to 9002
      - "9002:9000"
      - "9091:9090"
    environment:
      MINIO_ROOT_USER: mealie
      MINIO_ROOT_PASSWORD: mealie123
    volumes:
      - ../dev/data/minio:/data
  createbuckets:
    container_name: mealie_dev_createbuckets
    image: minio/mc
    restart: no
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set mealie http://minio:9000 mealie mealie123; do sleep 1; done;
      mc mb --ignore-existing mealie/mealie;
      "
